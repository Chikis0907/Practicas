name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar entorno de ejecución (Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: |
          npm install

      - name: Ejecutar compilación / construcción (Build)
        run: |
          npm run build --if-present

      - name: Ejecutar pruebas unitarias (Test)
        run: |
          npm test --if-present

      - name: Generar y empaquetar artefacto
        run: |
          zip -r artefacto-proyecto.zip . -x "*.git*" "node_modules/*"

      - name: Subir artefacto de la construcción
        uses: actions/upload-artifact@v4
        with:
          name: paquete-aplicacion
          path: artefacto-proyecto.zip