name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Compilacion y Pruebas
        run: |
          echo "Ejecutando verificacion del proyecto..."

      - name: Crear archivo de artefacto
        run: |
          echo "Paquete de la aplicacion listo para despliegue" > resultado-build.txt

      - name: Subir artefacto de la construccion
        uses: actions/upload-artifact@v4
        with:
          name: paquete-aplicacion
          path: resultado-build.txt
      
      