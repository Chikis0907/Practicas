name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar entorno de ejecución (Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: |
          npm install --if-present

      - name: Compilación y Pruebas
        run: |
          echo "Ejecutando pruebas y compilación del proyecto..."

      - name: Generar artefacto (Comprimir proyecto)
        run: |
          tar -czf artefacto-proyecto.tar.gz --exclude='.git' .

      - name: Subir artefacto de la construcción
        uses: actions/upload-artifact@v4
        with:
          name: paquete-aplicacion
          path: artefacto-proyecto.tar.gz